<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
   
  <style>
     body {
      background-image: url("bc image.jpeg");
      background-size: cover;
      background-position: center;
      font-family: 'Courier New', Courier, monospace;
    }

    #form {
      background: rgba(0, 0, 0, 0.6); /* halka dark background for readability */
      padding: 40px;
      border-radius: 15px;
      width: 300px;
      margin: 100px auto; 
      box-shadow: 0 0 15px black;
      color: blanchedalmond;
    }

    #form h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      font-weight: bold;
    }

    input[type="text"], 
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: none;
      border-radius: 5px;
      outline: none;
    }

    .btn {
      background-color: chocolate;
      color: white;
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }




    .btn:hover {
      background-color: darkorange;
    }

    .checkbox {
      margin: 10px 0;
    }
    
  </style>
</head>
<body>

  <form id="form">
    <h1>Login/sign up</h1>
    
    <label for="username">Username</label>
    <input type="text" name="username" id="username" placeholder="Enter Username" required>
    
    <label for="password">Password</label>
    <input type="password" name="password" id="password" placeholder="Enter Password" required>
    
    
    <input type="button" value="Forgot Password" onclick="window.location.href='Forgot-Password.html';" class="btn">
    <input type="submit" value="Login" class="btn">
    <input type="button" value="Sign-Up " onclick="window.location.href='Sign-Up.html';" class="btn"         >
    
    
  </form>
  
</body>
</html>
